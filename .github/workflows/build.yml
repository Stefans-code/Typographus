name: Build Typographus

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- macOS: Apple Silicon (arm64) + Intel (x64) ----------
  macos:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Build web bundle
        run: npm run build
      - name: Package DMG (arm64 + x64)
        run: npx electron-builder --mac --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # unsigned build (no Apple cert in CI)
      - name: Upload macOS DMGs
        uses: actions/upload-artifact@v4
        with:
          name: Typographus-macOS
          path: release/*.dmg

  # ---------- Windows: NSIS installer (x64) ----------
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Build web bundle
        run: npm run build
      - name: Package installer
        run: npx electron-builder --win --publish never
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Typographus-Windows
          path: release/*.exe
